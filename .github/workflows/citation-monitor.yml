name: Citation monitor

on:
  schedule:
    # Mondays at 08:00 UTC.
    - cron: "0 8 * * 1"
  workflow_dispatch:

concurrency:
  group: citation-monitor-main
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  find-citation-candidates:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pyyaml

      - name: Test automatic citation updates
        run: python -m unittest discover -s tests -p 'test_*.py' -v

      - name: Run citation monitor
        id: monitor
        shell: bash
        run: |
          python scripts/find_citation_candidates.py \
            --apply \
            --output citation-candidates.md

          cat citation-candidates.md

          if git diff --quiet -- _data/home/publications.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish new citations to main
        if: steps.monitor.outputs.changed == 'true'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _data/home/publications.yml
          git commit -m "Actualizar citas académicas automáticamente"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Upload citation report
        uses: actions/upload-artifact@v4
        with:
          name: citation-candidates
          path: citation-candidates.md

      - name: Open or update tracking issue
        if: steps.monitor.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh label create citation-monitor \
            --description "Weekly automatic citation monitor" \
            --color "1f77b4" 2>/dev/null || true

          issue_number="$(gh issue list \
            --label citation-monitor \
            --state open \
            --json number \
            --jq '.[0].number')"

          if [ -n "$issue_number" ]; then
            gh issue comment "$issue_number" --body-file citation-candidates.md
          else
            gh issue create \
              --title "Weekly citation candidates" \
              --label citation-monitor \
              --body-file citation-candidates.md
          fi
