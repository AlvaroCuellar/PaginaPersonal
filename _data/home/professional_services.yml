bio_note:
  es: "Es fundador de [HUMANITALIS](https://www.humanitalis.com/es), empresa especializada en inteligencia artificial aplicada al patrimonio cultural."
  en: "He is the founder of [HUMANITALIS](https://www.humanitalis.com/en), a company specialising in artificial intelligence for cultural heritage."
  fr: "Il est le fondateur de [HUMANITALIS](https://www.humanitalis.com/es), une entreprise spécialisée dans l’intelligence artificielle appliquée au patrimoine culturel."
  pt: "É fundador da [HUMANITALIS](https://www.humanitalis.com/es), empresa especializada em inteligência artificial aplicada ao património cultural."
  it: "È fondatore di [HUMANITALIS](https://www.humanitalis.com/es), impresa specializzata nell’intelligenza artificiale applicata al patrimonio culturale."
  de: "Er ist Gründer von [HUMANITALIS](https://www.humanitalis.com/es), einem auf künstliche Intelligenz für das kulturelle Erbe spezialisierten Unternehmen."
  zh: "他是 [HUMANITALIS](https://www.humanitalis.com/es) 的创始人，该公司专注于文化遗产领域的人工智能应用。"
  ja: "文化遺産への人工知能活用を専門とする企業 [HUMANITALIS](https://www.humanitalis.com/es) の創設者です。"
  ko: "문화유산 분야의 인공지능 활용을 전문으로 하는 기업 [HUMANITALIS](https://www.humanitalis.com/es)의 창립자입니다."
  ru: "Он является основателем компании [HUMANITALIS](https://www.humanitalis.com/es), специализирующейся на применении искусственного интеллекта в сфере культурного наследия."
  ar: "وهو مؤسس شركة [HUMANITALIS](https://www.humanitalis.com/es)، المتخصصة في تطبيق الذكاء الاصطناعي على التراث الثقافي."
