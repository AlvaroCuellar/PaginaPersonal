  tagline:
    es: "Inteligencia artificial para recuperar, estudiar y conservar el patrimonio cultural"
    en: "Artificial intelligence to recover, study and preserve cultural heritage"
    fr: "L’intelligence artificielle pour récupérer, étudier et préserver le patrimoine culturel"
    pt: "Inteligência artificial para recuperar, estudar e preservar o património cultural"
    it: "Intelligenza artificiale per recuperare, studiare e conservare il patrimonio culturale"
    de: "Künstliche Intelligenz zur Erschließung, Erforschung und Bewahrung des kulturellen Erbes"
    zh: "利用人工智能发掘、研究和保护文化遗产"
    ja: "文化遺産を発掘・研究・保存するための人工知能"
    ko: "문화유산을 발굴하고 연구하며 보존하기 위한 인공지능"
    ru: "Искусственный интеллект для восстановления, изучения и сохранения культурного наследия"
    ar: "الذكاء الاصطناعي لاستعادة التراث الثقافي ودراسته والحفاظ عليه"
  description:
    es: "Empresa fundada por Álvaro Cuéllar que ofrece soluciones especializadas de inteligencia artificial para archivos, bibliotecas, museos, universidades y colecciones históricas. Combina conocimiento humanístico, desarrollo tecnológico y estándares abiertos para transformar fondos patrimoniales en datos accesibles, estructurados y reutilizables."
    en: "A company founded by Álvaro Cuéllar offering specialised artificial-intelligence solutions for archives, libraries, museums, universities and historical collections. It combines humanities expertise, technological development and open standards to transform heritage collections into accessible, structured and reusable data."
    fr: "Entreprise fondée par Álvaro Cuéllar qui propose des solutions spécialisées d’intelligence artificielle pour les archives, bibliothèques, musées, universités et collections historiques. Elle associe expertise humaniste, développement technologique et standards ouverts afin de transformer les fonds patrimoniaux en données accessibles, structurées et réutilisables."
    pt: "Empresa fundada por Álvaro Cuéllar que oferece soluções especializadas de inteligência artificial para arquivos, bibliotecas, museus, universidades e coleções históricas. Combina conhecimento humanístico, desenvolvimento tecnológico e padrões abertos para transformar acervos patrimoniais em dados acessíveis, estruturados e reutilizáveis."
    it: "Impresa fondata da Álvaro Cuéllar che offre soluzioni specializzate di intelligenza artificiale per archivi, biblioteche, musei, università e collezioni storiche. Unisce competenze umanistiche, sviluppo tecnologico e standard aperti per trasformare i fondi culturali in dati accessibili, strutturati e riutilizzabili."
    de: "Ein von Álvaro Cuéllar gegründetes Unternehmen, das spezialisierte KI-Lösungen für Archive, Bibliotheken, Museen, Universitäten und historische Sammlungen anbietet. Es verbindet geisteswissenschaftliche Expertise, technologische Entwicklung und offene Standards, um Kulturbestände in zugängliche, strukturierte und nachnutzbare Daten zu verwandeln."
    zh: "由 Álvaro Cuéllar 创立的企业，为档案馆、图书馆、博物馆、大学和历史收藏提供专业人工智能解决方案。公司结合人文学科知识、技术开发和开放标准，将文化遗产馆藏转化为可访问、结构化且可重复利用的数据。"
    ja: "Álvaro Cuéllar が設立した企業で、文書館、図書館、博物館、大学、歴史資料コレクションに特化した人工知能ソリューションを提供しています。人文学の専門知識、技術開発、オープン標準を組み合わせ、文化遺産資料をアクセス可能で構造化された再利用可能なデータへと変換します。"
    ko: "Álvaro Cuéllar가 설립한 기업으로, 기록관·도서관·박물관·대학 및 역사 컬렉션을 위한 전문 인공지능 솔루션을 제공합니다. 인문학적 전문성, 기술 개발, 개방형 표준을 결합해 문화유산 컬렉션을 접근 가능하고 구조화되며 재사용할 수 있는 데이터로 전환합니다."
    ru: "Основанная Альваро Куэльяром компания предлагает специализированные решения на основе искусственного интеллекта для архивов, библиотек, музеев, университетов и исторических коллекций. Она объединяет гуманитарную экспертизу, технологические разработки и открытые стандарты, превращая культурное наследие в доступные, структурированные и многократно используемые данные."
    ar: "شركة أسسها ألفارو كوييار، تقدم حلولاً متخصصة في الذكاء الاصطناعي للأرشيفات والمكتبات والمتاحف والجامعات والمجموعات التاريخية. تجمع بين الخبرة الإنسانية والتطوير التقني والمعايير المفتوحة لتحويل مجموعات التراث إلى بيانات متاحة ومنظمة وقابلة لإعادة الاستخدام."
