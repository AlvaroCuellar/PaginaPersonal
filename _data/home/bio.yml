bio:
  es: |
    Álvaro Cuéllar González desarrolla su investigación en el ámbito de la computación aplicada a la literatura del Siglo de Oro. Su trabajo explora las posibilidades de los métodos informáticos para abordar cuestiones filológicas y abrir nuevas vías de estudio de los textos literarios. Desde 2017 colidera el proyecto <strong><b><em>Estilometría aplicada al teatro del Siglo de Oro</em></b></strong>, en el que más de 120 investigadores de distintos países y más de 100 estudiantes universitarios colaboran con textos para el análisis informático de un corpus de unas 3.000 obras teatrales. Ha creado <strong><b><em>TEXORO</em></b></strong>, una plataforma de búsqueda textual que reúne 40 millones de palabras de obras de teatro, prosa y poesía del Siglo de Oro. Para su desarrollo se han empleado técnicas de inteligencia artificial aplicadas a la transcripción automática de impresos y manuscritos auriseculares.

    Ha presentado sus investigaciones en <strong><b>congresos internacionales</b></strong> celebrados en Francia, España, Austria, China, Alemania, Suiza, Italia, Portugal, etc., y ha ofrecido <strong><b>conferencias invitadas</b></strong> en instituciones como la Biblioteca Nacional de España, la Universidad de Viena, la Universidad de Zúrich, la Universidad Nacional Autónoma de México, la Università degli Studi di Perugia, la Institución Libre de Enseñanza, o los Festivales de Teatro Clásico de Almagro y Olmedo. Asimismo, ha impartido <strong><b>conferencias plenarias</b></strong> en el centro iMAL de Bruselas, la Universidad de Ginebra, la Universidad de Cádiz, la Universidad de Santiago de Compostela, la Universidad Rey Juan Carlos, la UNED y la Sociedad Científica El Museo Canario, y ha coordinado el Encuentro en Humanidades Digitales del congreso AISO (Buenos Aires, 2026). Sus investigaciones han tenido difusión en medios como <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> o <em>Der Standard</em>, entre otros. Dos de las obras cuya autoría ha podido establecerse en el marco de sus investigaciones —<em>La monja alférez</em> y <em>La francesa Laura</em>— han sido representadas por compañías profesionales en Estados Unidos y España.

    Ha publicado libros en <strong><b>editoriales</b></strong> como <em>RBA Gredos</em> y <em>Reichenberger</em>, y artículos en <strong><b>revistas académicas</b></strong> como <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em>, <em>Revista de Literatura</em>, entre otras. También ha desarrollado recursos digitales para el estudio de la literatura del Siglo de Oro. Sus trabajos cuentan con <strong><b>más de 700 citas</b></strong> y se enmarcan en <strong><b>más de 10 proyectos de investigación</b></strong> financiados en España, Alemania y Austria. Ha recibido <strong><b>becas y reconocimientos</b></strong> como la Beca La Caixa para estudios de posgrado en Estados Unidos, el premio al Mejor Proyecto de 2018 y al Mejor Artículo de 2023 de la Asociación Internacional de Humanidades Digitales Hispánicas, finalista en los Premios Archiletras (2023), la beca Sigma Delta Phi (2021), el contrato Juan de la Cierva (Universidad Autónoma de Barcelona), el Seal of Excellence Marie Skłodowska-Curie, o la invitación como <strong><b>Mercator Fellow</b></strong> de la Deutsche Forschungsgemeinschaft (DFG) en la Universidad de Tubinga.

  en: |
    Álvaro Cuéllar González conducts research in computational approaches to Spanish Golden Age literature. His work explores how computational methods can address philological questions and open new avenues for studying literary texts. Since 2017, he has co-led the project <strong><b><em>Stylometry Applied to Spanish Golden Age Theatre</em></b></strong>, in which more than 120 researchers from different countries and over 100 university students contribute texts for the computational analysis of a corpus of around 3,000 plays. He has created <strong><b><em>TEXORO</em></b></strong>, a textual search platform containing 40 million words from works of theatre, prose, and poetry of the Spanish Golden Age. Its development has involved artificial intelligence techniques for the automatic transcription of early modern printed texts and manuscripts.

    He has presented his research at <strong><b>international conferences</b></strong> in France, Spain, Austria, China, Germany, Switzerland, Italy, Portugal, and other countries, and has delivered <strong><b>invited lectures</b></strong> at institutions such as the National Library of Spain, the University of Vienna, the University of Zurich, the National Autonomous University of Mexico, the University of Perugia, the Institución Libre de Enseñanza, and the Classical Theatre Festivals of Almagro and Olmedo. He has also delivered <strong><b>plenary lectures</b></strong> at the iMAL Centre in Brussels, the University of Geneva, the University of Cádiz, the University of Santiago de Compostela, Rey Juan Carlos University, the UNED, and the Sociedad Científica El Museo Canario, and has coordinated the Digital Humanities Researchers’ Meeting at the AISO Conference (Buenos Aires, 2026). His research has been covered by media outlets such as <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em>, and <em>Der Standard</em>, among others. Two plays whose authorship has been established through his research —<em>La monja alférez</em> and <em>La francesa Laura</em>— have been performed by professional theatre companies in the United States and Spain.

    He has published books with <strong><b>publishers</b></strong> such as <em>RBA Gredos</em> and <em>Reichenberger</em>, and articles in <strong><b>academic journals</b></strong> such as <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em>, and <em>Revista de Literatura</em>, among others. He has also developed digital resources for the study of Spanish Golden Age literature. His works have received <strong><b>over 700 citations</b></strong> and are associated with <strong><b>more than 10 research projects</b></strong> funded in Spain, Germany, and Austria. He has received <strong><b>fellowships and distinctions</b></strong> including the La Caixa Fellowship for postgraduate studies in the United States, the Best Project (2018) and Best Article (2023) awards from the International Association of Hispanic Digital Humanities, finalist recognition in the Archiletras Awards (2023), the Sigma Delta Phi Fellowship (2021), the Juan de la Cierva contract (Autonomous University of Barcelona), the Marie Skłodowska-Curie Seal of Excellence, and an invitation as a <strong><b>Mercator Fellow</b></strong> of the Deutsche Forschungsgemeinschaft (DFG) at the University of Tübingen.

  fr: |-
    Álvaro Cuéllar González mène ses recherches dans le domaine de l'informatique appliquée à la littérature du Siècle d'Or espagnol. Son travail explore les possibilités des méthodes informatiques pour aborder des questions philologiques et ouvrir de nouvelles voies d'étude des textes littéraires. Depuis 2017, il codirige le projet <strong><b><em>Stylométrie appliquée au théâtre du Siècle d'Or espagnol</em></b></strong>, auquel plus de 120 chercheurs de différents pays et plus de 100 étudiants universitaires contribuent en fournissant des textes pour l'analyse informatique d'un corpus d'environ 3 000 pièces de théâtre. Il a créé <strong><b><em>TEXORO</em></b></strong>, une plateforme de recherche textuelle qui rassemble 40 millions de mots issus d'œuvres théâtrales, de prose et de poésie du Siècle d'Or espagnol. Son développement a fait appel à des techniques d'intelligence artificielle appliquées à la transcription automatique d'imprimés et de manuscrits de cette époque.

    Il a présenté ses recherches lors de <strong><b>congrès internationaux</b></strong> organisés en France, en Espagne, en Autriche, en Chine, en Allemagne, en Suisse, en Italie, au Portugal, entre autres, et a donné des <strong><b>conférences sur invitation</b></strong> dans des institutions telles que la Bibliothèque nationale d'Espagne, l'Université de Vienne, l'Université de Zurich, l'Université nationale autonome du Mexique, l'Università degli Studi di Perugia, l'Institución Libre de Enseñanza ou les festivals de théâtre classique d'Almagro et d'Olmedo. Il a également donné des <strong><b>conférences plénières</b></strong> au centre iMAL de Bruxelles, à l'Université de Genève, à l'Université de Cadix, à l'Université de Saint-Jacques-de-Compostelle, à l'Université Rey Juan Carlos, à l'UNED et à la Sociedad Científica El Museo Canario, et a coordonné la rencontre consacrée aux humanités numériques du congrès AISO (Buenos Aires, 2026). Ses recherches ont été relayées par des médias tels que <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> ou <em>Der Standard</em>, entre autres. Deux des œuvres dont l'auteur a pu être identifié dans le cadre de ses recherches —<em>La monja alférez</em> et <em>La francesa Laura</em>— ont été représentées par des compagnies professionnelles aux États-Unis et en Espagne.

    Il a publié des livres chez des <strong><b>éditeurs</b></strong> tels que <em>RBA Gredos</em> et <em>Reichenberger</em>, ainsi que des articles dans des <strong><b>revues scientifiques</b></strong> telles que <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em> et <em>Revista de Literatura</em>, entre autres. Il a également développé des ressources numériques pour l'étude de la littérature du Siècle d'Or espagnol. Ses travaux comptent <strong><b>plus de 700 citations</b></strong> et s'inscrivent dans <strong><b>plus de 10 projets de recherche</b></strong> financés en Espagne, en Allemagne et en Autriche. Il a reçu des <strong><b>bourses et distinctions</b></strong>, notamment la bourse La Caixa pour des études de troisième cycle aux États-Unis, les prix du meilleur projet de 2018 et du meilleur article de 2023 de l'Association internationale des humanités numériques hispaniques, une place de finaliste aux Premios Archiletras (2023), la bourse Sigma Delta Phi (2021), le contrat Juan de la Cierva (Université autonome de Barcelone), le Seal of Excellence Marie Skłodowska-Curie et une invitation en tant que <strong><b>Mercator Fellow</b></strong> de la Deutsche Forschungsgemeinschaft (DFG) à l'Université de Tübingen.
  pt: |-
    Álvaro Cuéllar González desenvolve a sua investigação no âmbito da computação aplicada à literatura do Século de Ouro espanhol. O seu trabalho explora as possibilidades dos métodos informáticos para abordar questões filológicas e abrir novas vias de estudo dos textos literários. Desde 2017, colidera o projeto <strong><b><em>Estilometria aplicada ao teatro do Século de Ouro espanhol</em></b></strong>, no qual mais de 120 investigadores de diferentes países e mais de 100 estudantes universitários contribuem com textos para a análise informática de um corpus de cerca de 3.000 obras teatrais. Criou <strong><b><em>TEXORO</em></b></strong>, uma plataforma de pesquisa textual que reúne 40 milhões de palavras de obras de teatro, prosa e poesia do Século de Ouro espanhol. No seu desenvolvimento foram empregues técnicas de inteligência artificial aplicadas à transcrição automática de impressos e manuscritos dessa época.

    Apresentou as suas investigações em <strong><b>congressos internacionais</b></strong> realizados em França, Espanha, Áustria, China, Alemanha, Suíça, Itália, Portugal, entre outros países, e proferiu <strong><b>conferências por convite</b></strong> em instituições como a Biblioteca Nacional de Espanha, a Universidade de Viena, a Universidade de Zurique, a Universidade Nacional Autónoma do México, a Università degli Studi di Perugia, a Institución Libre de Enseñanza ou os festivais de teatro clássico de Almagro e Olmedo. Proferiu também <strong><b>conferências plenárias</b></strong> no centro iMAL de Bruxelas, na Universidade de Genebra, na Universidade de Cádis, na Universidade de Santiago de Compostela, na Universidade Rey Juan Carlos, na UNED e na Sociedad Científica El Museo Canario, e coordenou o Encontro de Humanidades Digitais do congresso AISO (Buenos Aires, 2026). As suas investigações tiveram divulgação em meios de comunicação como <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> ou <em>Der Standard</em>, entre outros. Duas das obras cuja autoria pôde ser estabelecida no âmbito das suas investigações —<em>La monja alférez</em> e <em>La francesa Laura</em>— foram representadas por companhias profissionais nos Estados Unidos e em Espanha.

    Publicou livros em <strong><b>editoras</b></strong> como <em>RBA Gredos</em> e <em>Reichenberger</em>, e artigos em <strong><b>revistas académicas</b></strong> como <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em> e <em>Revista de Literatura</em>, entre outras. Desenvolveu também recursos digitais para o estudo da literatura do Século de Ouro espanhol. Os seus trabalhos contam com <strong><b>mais de 700 citações</b></strong> e enquadram-se em <strong><b>mais de 10 projetos de investigação</b></strong> financiados em Espanha, Alemanha e Áustria. Recebeu <strong><b>bolsas e distinções</b></strong> como a bolsa La Caixa para estudos de pós-graduação nos Estados Unidos, os prémios de Melhor Projeto de 2018 e de Melhor Artigo de 2023 da Associação Internacional de Humanidades Digitais Hispânicas, a distinção de finalista nos Premios Archiletras (2023), a bolsa Sigma Delta Phi (2021), o contrato Juan de la Cierva (Universidade Autónoma de Barcelona), o Seal of Excellence Marie Skłodowska-Curie ou o convite como <strong><b>Mercator Fellow</b></strong> da Deutsche Forschungsgemeinschaft (DFG) na Universidade de Tubinga.
  it: |-
    Álvaro Cuéllar González svolge la sua ricerca nell'ambito dell'informatica applicata alla letteratura del Siglo de Oro. Il suo lavoro esplora le possibilità dei metodi informatici per affrontare questioni filologiche e aprire nuove vie di studio dei testi letterari. Dal 2017 codirige il progetto <strong><b><em>Stilometria applicata al teatro del Siglo de Oro</em></b></strong>, al quale oltre 120 ricercatori di diversi paesi e più di 100 studenti universitari contribuiscono fornendo testi per l'analisi informatica di un corpus di circa 3.000 opere teatrali. Ha creato <strong><b><em>TEXORO</em></b></strong>, una piattaforma di ricerca testuale che raccoglie 40 milioni di parole tratte da opere teatrali, in prosa e in poesia del Siglo de Oro. Per il suo sviluppo sono state impiegate tecniche di intelligenza artificiale applicate alla trascrizione automatica di testi a stampa e manoscritti dell'epoca.

    Ha presentato le sue ricerche a <strong><b>congressi internazionali</b></strong> tenutisi in Francia, Spagna, Austria, Cina, Germania, Svizzera, Italia, Portogallo e altri paesi, e ha tenuto <strong><b>conferenze su invito</b></strong> presso istituzioni come la Biblioteca Nazionale di Spagna, l'Università di Vienna, l'Università di Zurigo, l'Università Nazionale Autonoma del Messico, l'Università degli Studi di Perugia, l'Institución Libre de Enseñanza o i festival di teatro classico di Almagro e Olmedo. Ha inoltre tenuto <strong><b>conferenze plenarie</b></strong> presso il centro iMAL di Bruxelles, l'Università di Ginevra, l'Università di Cadice, l'Università di Santiago de Compostela, l'Università Rey Juan Carlos, l'UNED e la Sociedad Científica El Museo Canario, e ha coordinato l'incontro sulle discipline umanistiche digitali del congresso AISO (Buenos Aires, 2026). Le sue ricerche hanno avuto diffusione su mezzi d'informazione come <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> o <em>Der Standard</em>, tra gli altri. Due delle opere la cui attribuzione è stata stabilita nell'ambito delle sue ricerche —<em>La monja alférez</em> e <em>La francesa Laura</em>— sono state rappresentate da compagnie professionali negli Stati Uniti e in Spagna.

    Ha pubblicato libri presso <strong><b>case editrici</b></strong> come <em>RBA Gredos</em> e <em>Reichenberger</em>, e articoli su <strong><b>riviste accademiche</b></strong> come <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em> e <em>Revista de Literatura</em>, tra le altre. Ha inoltre sviluppato risorse digitali per lo studio della letteratura del Siglo de Oro. I suoi lavori contano <strong><b>oltre 700 citazioni</b></strong> e si inseriscono in <strong><b>più di 10 progetti di ricerca</b></strong> finanziati in Spagna, Germania e Austria. Ha ricevuto <strong><b>borse di studio e riconoscimenti</b></strong> come la borsa La Caixa per studi post-laurea negli Stati Uniti, i premi per il Miglior Progetto del 2018 e il Miglior Articolo del 2023 dell'Associazione internazionale di informatica umanistica ispanica, il riconoscimento di finalista ai Premios Archiletras (2023), la borsa Sigma Delta Phi (2021), il contratto Juan de la Cierva (Università Autonoma di Barcellona), il Seal of Excellence Marie Skłodowska-Curie o l'invito come <strong><b>Mercator Fellow</b></strong> della Deutsche Forschungsgemeinschaft (DFG) presso l'Università di Tubinga.
  de: |-
    Álvaro Cuéllar González forscht im Bereich der Anwendung informatischer Methoden auf die Literatur des spanischen Siglo de Oro. Seine Arbeit untersucht die Möglichkeiten computergestützter Methoden, philologische Fragen zu bearbeiten und neue Wege zur Erforschung literarischer Texte zu eröffnen. Seit 2017 leitet er das Projekt <strong><b><em>Stilometrie des Theaters des spanischen Siglo de Oro</em></b></strong> mit, an dem mehr als 120 Forschende aus verschiedenen Ländern und über 100 Studierende mitwirken, indem sie Texte für die computergestützte Analyse eines Korpus von rund 3.000 Theaterstücken bereitstellen. Er hat <strong><b><em>TEXORO</em></b></strong> entwickelt, eine Plattform für die Textsuche, die 40 Millionen Wörter aus Theaterstücken, Prosa und Lyrik des spanischen Siglo de Oro umfasst. Bei ihrer Entwicklung wurden Verfahren der künstlichen Intelligenz zur automatischen Transkription von Drucken und Handschriften dieser Epoche eingesetzt.

    Er hat seine Forschung auf <strong><b>internationalen Kongressen</b></strong> in Frankreich, Spanien, Österreich, China, Deutschland, der Schweiz, Italien, Portugal und weiteren Ländern vorgestellt und <strong><b>eingeladene Vorträge</b></strong> an Einrichtungen wie der Spanischen Nationalbibliothek, der Universität Wien, der Universität Zürich, der Nationalen Autonomen Universität von Mexiko, der Università degli Studi di Perugia, der Institución Libre de Enseñanza sowie bei den Festivals für klassisches Theater in Almagro und Olmedo gehalten. Darüber hinaus hat er <strong><b>Plenarvorträge</b></strong> am Zentrum iMAL in Brüssel, an der Universität Genf, der Universität Cádiz, der Universität Santiago de Compostela, der Universität Rey Juan Carlos, der UNED und der Sociedad Científica El Museo Canario gehalten und das Treffen zu Digital Humanities beim AISO-Kongress (Buenos Aires, 2026) koordiniert. Über seine Forschung wurde in Medien wie <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> und <em>Der Standard</em> berichtet. Zwei der Werke, deren Autorschaft im Rahmen seiner Forschung geklärt werden konnte —<em>La monja alférez</em> und <em>La francesa Laura</em>— wurden von professionellen Ensembles in den Vereinigten Staaten und in Spanien aufgeführt.

    Er hat Bücher bei <strong><b>Verlagen</b></strong> wie <em>RBA Gredos</em> und <em>Reichenberger</em> sowie Artikel in <strong><b>wissenschaftlichen Zeitschriften</b></strong> wie <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em> und <em>Revista de Literatura</em> veröffentlicht. Außerdem hat er digitale Ressourcen zur Erforschung der Literatur des spanischen Siglo de Oro entwickelt. Seine Arbeiten verzeichnen <strong><b>mehr als 700 Zitationen</b></strong> und sind Teil von <strong><b>mehr als 10 Forschungsprojekten</b></strong>, die in Spanien, Deutschland und Österreich gefördert werden. Er hat <strong><b>Stipendien und Auszeichnungen</b></strong> erhalten, darunter das La-Caixa-Stipendium für ein weiterführendes Studium in den Vereinigten Staaten, die Preise für das beste Projekt 2018 und den besten Artikel 2023 der Internationalen Vereinigung für hispanistische Digital Humanities, die Anerkennung als Finalist bei den Premios Archiletras (2023), das Sigma-Delta-Phi-Stipendium (2021), den Juan-de-la-Cierva-Vertrag (Autonome Universität Barcelona), das Marie-Skłodowska-Curie-Seal-of-Excellence und eine Einladung als <strong><b>Mercator Fellow</b></strong> der Deutschen Forschungsgemeinschaft (DFG) an die Universität Tübingen.
  zh: |-
    Álvaro Cuéllar González 的研究领域是计算方法在西班牙黄金时代文学中的应用。他探索如何运用计算方法解决语文学问题，并为文学文本研究开辟新的路径。自2017年起，他共同主持<strong><b><em>西班牙黄金时代戏剧的文体计量研究</em></b></strong>项目，来自不同国家的120多名研究人员和100多名大学生为该项目提供文本，用于对约3,000部戏剧组成的语料库进行计算分析。他创建了<strong><b><em>TEXORO</em></b></strong>，这一文本检索平台收录了西班牙黄金时代戏剧、散文和诗歌作品，共计4,000万词。平台开发采用了人工智能技术，对黄金时代的印刷文献和手稿进行自动转录。

    他曾在法国、西班牙、奥地利、中国、德国、瑞士、意大利、葡萄牙等国举办的<strong><b>国际学术会议</b></strong>上报告研究成果，并在西班牙国家图书馆、维也纳大学、苏黎世大学、墨西哥国立自治大学、佩鲁贾大学、Institución Libre de Enseñanza以及阿尔马格罗和奥尔梅多古典戏剧节等机构和活动中作<strong><b>受邀讲座</b></strong>。他还曾在布鲁塞尔iMAL中心、日内瓦大学、加的斯大学、圣地亚哥德孔波斯特拉大学、胡安卡洛斯国王大学、UNED和Sociedad Científica El Museo Canario作<strong><b>大会主旨报告</b></strong>，并协调了AISO大会的数字人文专题活动（布宜诺斯艾利斯，2026年）。他的研究曾获<em>The Times</em>、<em>The Guardian</em>、<em>Le Figaro</em>、<em>Reuters</em>、<em>BBC</em>、<em>CNN</em>、<em>El País</em>、<em>ABC</em>、<em>RTVE</em>、<em>El Mundo</em>、<em>Japan News</em>和<em>Der Standard</em>等媒体报道。在其研究中得以确定作者归属的两部作品——<em>La monja alférez</em>和<em>La francesa Laura</em>——已由专业剧团在美国和西班牙上演。

    他在<em>RBA Gredos</em>、<em>Reichenberger</em>等<strong><b>出版社</b></strong>出版了书籍，并在<em>Anuario Lope de Vega</em>、<em>Hipogrifo</em>、<em>Janus</em>、<em>Anuario Calderoniano</em>和<em>Revista de Literatura</em>等<strong><b>学术期刊</b></strong>发表了论文。他还开发了用于研究西班牙黄金时代文学的数字资源。他的研究成果获得了<strong><b>700多次引用</b></strong>，相关工作属于在西班牙、德国和奥地利获得资助的<strong><b>10多个研究项目</b></strong>。他获得的<strong><b>奖学金与学术荣誉</b></strong>包括支持赴美国攻读研究生的La Caixa奖学金、国际西班牙语数字人文协会2018年最佳项目奖和2023年最佳论文奖、2023年Archiletras奖入围、2021年Sigma Delta Phi奖学金、巴塞罗那自治大学Juan de la Cierva研究合同、Marie Skłodowska-Curie卓越印章，以及受德国研究基金会（DFG）邀请在蒂宾根大学担任<strong><b>Mercator Fellow</b></strong>。
  ja: |-
    Álvaro Cuéllar Gonzálezは、スペイン黄金世紀文学への計算手法の応用を研究している。情報処理の手法を用いて文献学的な問題に取り組み、文学テクストの研究に新たな道を開く可能性を探っている。2017年から<strong><b><em>スペイン黄金世紀演劇への文体計量学の応用</em></b></strong>プロジェクトを共同で率いており、各国の120名を超える研究者と100名を超える大学生が、約3,000作品からなる演劇コーパスの計算分析に向けてテクストを提供している。また、黄金世紀の演劇、散文、詩の作品から4,000万語を収録したテクスト検索プラットフォーム<strong><b><em>TEXORO</em></b></strong>を開発した。その開発には、黄金世紀の印刷物と写本を自動で翻刻する人工知能技術が用いられている。

    フランス、スペイン、オーストリア、中国、ドイツ、スイス、イタリア、ポルトガルなどで開催された<strong><b>国際学会</b></strong>で研究を発表し、スペイン国立図書館、ウィーン大学、チューリヒ大学、メキシコ国立自治大学、ペルージャ大学、Institución Libre de Enseñanza、アルマグロとオルメドの古典演劇祭などで<strong><b>招待講演</b></strong>を行ってきた。また、ブリュッセルのiMALセンター、ジュネーヴ大学、カディス大学、サンティアゴ・デ・コンポステーラ大学、レイ・フアン・カルロス大学、UNED、Sociedad Científica El Museo Canarioで<strong><b>全体会議講演</b></strong>を行い、AISO大会のデジタル・ヒューマニティーズ研究集会（ブエノスアイレス、2026年）をコーディネートした。その研究は、<em>The Times</em>、<em>The Guardian</em>、<em>Le Figaro</em>、<em>Reuters</em>、<em>BBC</em>、<em>CNN</em>、<em>El País</em>、<em>ABC</em>、<em>RTVE</em>、<em>El Mundo</em>、<em>Japan News</em>、<em>Der Standard</em>などのメディアで紹介されている。研究を通じて作者を特定できた作品のうち、<em>La monja alférez</em>と<em>La francesa Laura</em>は、米国とスペインのプロの劇団によって上演された。

    <em>RBA Gredos</em>や<em>Reichenberger</em>などの<strong><b>出版社</b></strong>から書籍を刊行し、<em>Anuario Lope de Vega</em>、<em>Hipogrifo</em>、<em>Janus</em>、<em>Anuario Calderoniano</em>、<em>Revista de Literatura</em>などの<strong><b>学術誌</b></strong>に論文を発表している。また、スペイン黄金世紀文学の研究に向けたデジタル資料も開発している。研究成果は<strong><b>700回以上引用</b></strong>されており、スペイン、ドイツ、オーストリアで助成を受けた<strong><b>10件を超える研究プロジェクト</b></strong>の一環をなしている。受けた<strong><b>奨学金・学術的評価</b></strong>には、米国での大学院留学を支援するLa Caixa奨学金、国際ヒスパニック・デジタル・ヒューマニティーズ協会の2018年最優秀プロジェクト賞と2023年最優秀論文賞、Archiletras賞の最終候補選出（2023年）、Sigma Delta Phi奨学金（2021年）、Juan de la Cierva研究契約（バルセロナ自治大学）、Marie Skłodowska-Curie Seal of Excellence、ドイツ研究振興協会（DFG）によるテュービンゲン大学への<strong><b>Mercator Fellow</b></strong>としての招聘がある。
  ko: |-
    Álvaro Cuéllar González는 스페인 황금시대 문학에 컴퓨터 기법을 적용하는 연구를 수행한다. 그의 연구는 정보 처리 방법을 통해 문헌학적 문제를 다루고 문학 텍스트 연구의 새로운 방향을 모색한다. 2017년부터 <strong><b><em>스페인 황금시대 연극에 적용한 문체 계량학</em></b></strong> 프로젝트를 공동으로 이끌고 있다. 이 프로젝트에서는 여러 나라의 연구자 120명이 넘는 인원과 대학생 100명이 넘는 인원이 약 3,000편의 희곡으로 이루어진 코퍼스의 컴퓨터 분석을 위해 텍스트를 제공한다. 그는 황금시대의 희곡, 산문, 시 작품에서 총 4,000만 단어를 수록한 텍스트 검색 플랫폼 <strong><b><em>TEXORO</em></b></strong>를 개발했다. 개발 과정에서는 황금시대 인쇄본과 필사본의 자동 전사에 인공지능 기술을 활용했다.

    그는 프랑스, 스페인, 오스트리아, 중국, 독일, 스위스, 이탈리아, 포르투갈 등에서 열린 <strong><b>국제 학술대회</b></strong>에서 연구를 발표했으며, 스페인 국립도서관, 빈 대학교, 취리히 대학교, 멕시코 국립자치대학교, 페루자 대학교, Institución Libre de Enseñanza, 알마그로와 올메도의 고전 연극 축제 등에서 <strong><b>초청 강연</b></strong>을 했다. 또한 브뤼셀 iMAL 센터, 제네바 대학교, 카디스 대학교, 산티아고 데 콤포스텔라 대학교, 레이 후안 카를로스 대학교, UNED, Sociedad Científica El Museo Canario에서 <strong><b>전체회의 강연</b></strong>을 했으며, AISO 학술대회의 디지털 인문학 모임을 총괄했다(부에노스아이레스, 2026년). 그의 연구는 <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em>, <em>Der Standard</em> 등의 매체에서 소개되었다. 연구를 통해 작가를 확인할 수 있었던 두 작품인 <em>La monja alférez</em>와 <em>La francesa Laura</em>는 미국과 스페인의 전문 극단에서 공연되었다.

    그는 <em>RBA Gredos</em>, <em>Reichenberger</em> 등의 <strong><b>출판사</b></strong>에서 책을 출간하고, <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em>, <em>Revista de Literatura</em> 등의 <strong><b>학술지</b></strong>에 논문을 발표했다. 또한 스페인 황금시대 문학 연구를 위한 디지털 자료를 개발했다. 그의 연구 성과는 <strong><b>700회 이상 인용</b></strong>되었으며, 스페인, 독일, 오스트리아에서 지원받은 <strong><b>10개가 넘는 연구 프로젝트</b></strong>의 일환으로 이루어졌다. 그가 받은 <strong><b>장학금과 학술적 인정</b></strong>에는 미국 대학원 유학을 위한 La Caixa 장학금, 국제 히스패닉 디지털 인문학 협회의 2018년 최우수 프로젝트상과 2023년 최우수 논문상, Archiletras 상 최종 후보 선정(2023년), Sigma Delta Phi 장학금(2021년), Juan de la Cierva 연구 계약(바르셀로나 자치대학교), Marie Skłodowska-Curie Seal of Excellence, 그리고 독일연구재단(DFG)의 튀빙겐 대학교 <strong><b>Mercator Fellow</b></strong> 초청이 있다.
  ru: |-
    Альваро Куэльяр Гонсалес занимается исследованиями в области применения вычислительных методов к литературе испанского Золотого века. Его работа посвящена возможностям компьютерных методов в решении филологических вопросов и поиске новых подходов к изучению литературных текстов. С 2017 года он является соруководителем проекта <strong><b><em>Стилометрия в исследовании театра испанского Золотого века</em></b></strong>, в рамках которого более 120 исследователей из разных стран и более 100 студентов университетов предоставляют тексты для компьютерного анализа корпуса из примерно 3000 пьес. Он создал <strong><b><em>TEXORO</em></b></strong> — платформу текстового поиска, объединяющую 40 миллионов слов из драматических, прозаических и поэтических произведений испанского Золотого века. При её разработке использовались методы искусственного интеллекта для автоматической транскрипции печатных изданий и рукописей этой эпохи.

    Он представлял свои исследования на <strong><b>международных конференциях</b></strong> во Франции, Испании, Австрии, Китае, Германии, Швейцарии, Италии, Португалии и других странах и выступал с <strong><b>приглашёнными лекциями</b></strong> в таких учреждениях, как Национальная библиотека Испании, Венский университет, Цюрихский университет, Национальный автономный университет Мексики, Университет Перуджи, Institución Libre de Enseñanza, а также на фестивалях классического театра в Альмагро и Ольмедо. Он также выступал с <strong><b>пленарными докладами</b></strong> в центре iMAL в Брюсселе, Женевском университете, Университете Кадиса, Университете Сантьяго-де-Компостела, Университете имени короля Хуана Карлоса, UNED и научном обществе El Museo Canario и координировал встречу по цифровым гуманитарным наукам на конгрессе AISO (Буэнос-Айрес, 2026). Его исследования освещались в таких СМИ, как <em>The Times</em>, <em>The Guardian</em>, <em>Le Figaro</em>, <em>Reuters</em>, <em>BBC</em>, <em>CNN</em>, <em>El País</em>, <em>ABC</em>, <em>RTVE</em>, <em>El Mundo</em>, <em>Japan News</em> и <em>Der Standard</em>, среди прочих. Две пьесы, авторство которых удалось установить в рамках его исследований, — <em>La monja alférez</em> и <em>La francesa Laura</em> — были поставлены профессиональными театральными компаниями в США и Испании.

    Он опубликовал книги в таких <strong><b>издательствах</b></strong>, как <em>RBA Gredos</em> и <em>Reichenberger</em>, и статьи в таких <strong><b>научных журналах</b></strong>, как <em>Anuario Lope de Vega</em>, <em>Hipogrifo</em>, <em>Janus</em>, <em>Anuario Calderoniano</em> и <em>Revista de Literatura</em>, среди прочих. Он также разработал цифровые ресурсы для изучения литературы испанского Золотого века. Его работы получили <strong><b>более 700 цитирований</b></strong> и выполнены в рамках <strong><b>более 10 исследовательских проектов</b></strong>, финансируемых в Испании, Германии и Австрии. Он получил <strong><b>стипендии и награды</b></strong>, в том числе стипендию La Caixa для обучения в аспирантуре в США, премии за лучший проект 2018 года и лучшую статью 2023 года Международной ассоциации испаноязычных цифровых гуманитарных наук, статус финалиста премии Archiletras (2023), стипендию Sigma Delta Phi (2021), контракт Juan de la Cierva (Автономный университет Барселоны), знак качества Marie Skłodowska-Curie Seal of Excellence и приглашение в качестве <strong><b>Mercator Fellow</b></strong> Немецкого научно-исследовательского сообщества (DFG) в Тюбингенский университет.

  ar: |-
    يعمل ألفارو كويلار غونزاليس في مجال تطبيق الأساليب الحاسوبية على أدب العصر الذهبي الإسباني. ويستكشف في أبحاثه إمكانات هذه الأساليب لمعالجة مسائل فقه اللغة وفتح مسارات جديدة لدراسة النصوص الأدبية. منذ عام 2017، يشارك في قيادة مشروع <strong><b><em>قياس الأسلوب المطبق على مسرح العصر الذهبي الإسباني</em></b></strong>، الذي يساهم فيه أكثر من 120 باحثًا من بلدان مختلفة وأكثر من 100 طالب جامعي بتوفير نصوص للتحليل الحاسوبي لمجموعة تضم نحو 3000 مسرحية. وقد أنشأ <strong><b><em>TEXORO</em></b></strong>، وهي منصة للبحث النصي تجمع 40 مليون كلمة من أعمال مسرحية ونثرية وشعرية من العصر الذهبي الإسباني. واستُخدمت في تطويرها تقنيات الذكاء الاصطناعي للنسخ الآلي للمطبوعات والمخطوطات من ذلك العصر.

    عرض أبحاثه في <strong><b>مؤتمرات دولية</b></strong> أقيمت في فرنسا وإسبانيا والنمسا والصين وألمانيا وسويسرا وإيطاليا والبرتغال وغيرها، وألقى <strong><b>محاضرات بدعوة</b></strong> في مؤسسات مثل المكتبة الوطنية الإسبانية وجامعة فيينا وجامعة زيورخ والجامعة الوطنية المستقلة في المكسيك وجامعة بيروجيا وInstitución Libre de Enseñanza، وكذلك في مهرجاني المسرح الكلاسيكي في ألماغرو وأولميدو. كما ألقى <strong><b>محاضرات في الجلسات العامة</b></strong> في مركز iMAL في بروكسل وجامعة جنيف وجامعة قادس وجامعة سانتياغو دي كومبوستيلا وجامعة الملك خوان كارلوس وUNED والجمعية العلمية El Museo Canario، ونسّق لقاء الإنسانيات الرقمية في مؤتمر AISO (بوينس آيرس، 2026). وحظيت أبحاثه بتغطية في وسائل إعلام مثل <em>The Times</em> و<em>The Guardian</em> و<em>Le Figaro</em> و<em>Reuters</em> و<em>BBC</em> و<em>CNN</em> و<em>El País</em> و<em>ABC</em> و<em>RTVE</em> و<em>El Mundo</em> و<em>Japan News</em> و<em>Der Standard</em>، وغيرها. وقد قدمت فرق مسرحية محترفة في الولايات المتحدة وإسبانيا عملين أمكن تحديد مؤلفيهما في إطار أبحاثه، وهما <em>La monja alférez</em> و<em>La francesa Laura</em>.

    نشر كتبًا لدى <strong><b>دور نشر</b></strong> مثل <em>RBA Gredos</em> و<em>Reichenberger</em>، ومقالات في <strong><b>مجلات أكاديمية</b></strong> مثل <em>Anuario Lope de Vega</em> و<em>Hipogrifo</em> و<em>Janus</em> و<em>Anuario Calderoniano</em> و<em>Revista de Literatura</em>، وغيرها. كما طوّر موارد رقمية لدراسة أدب العصر الذهبي الإسباني. وقد حظيت أعماله <strong><b>بأكثر من 700 استشهاد</b></strong>، وتندرج ضمن <strong><b>أكثر من 10 مشروعات بحثية</b></strong> ممولة في إسبانيا وألمانيا والنمسا. وحصل على <strong><b>منح وتكريمات</b></strong>، منها منحة La Caixa للدراسات العليا في الولايات المتحدة، وجائزتا أفضل مشروع لعام 2018 وأفضل مقال لعام 2023 من الجمعية الدولية للإنسانيات الرقمية الإسبانية، والوصول إلى المرحلة النهائية لجوائز Archiletras (2023)، ومنحة Sigma Delta Phi (2021)، وعقد Juan de la Cierva (جامعة برشلونة المستقلة)، وختم التميز Marie Skłodowska-Curie، ودعوة بصفة <strong><b>Mercator Fellow</b></strong> من مؤسسة الأبحاث الألمانية (DFG) في جامعة توبنغن.

